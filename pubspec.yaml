name: task_management_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  # Thêm thư viện định vị
  geolocator: ^14.1.2
  # Bản đồ chọn vị trí nhắc nhở
  google_maps_flutter: ^2.10.0
  confetti: ^0.8.0
  provider: ^6.1.2
  # Backend online (đăng nhập + dữ liệu thật)
  supabase_flutter: ^2.8.0
  # Thông báo nhắc nhở hẹn giờ (chạy cả khi tắt app)
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  cupertino_icons: ^2.0.0
  image_picker: ^1.2.4
  # Widget ngoài màn hình chính (Android)
  home_widget: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true